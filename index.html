<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="Contact Weston Deering at Instead." />
  <title>Weston Deering | Instead</title>
  <style>
    :root {
      --paper:#f7f6f2;
      --ink:#111111;
      --soft:#6c6a65;
      --line:#d9d7d1;
      --white:#ffffff;
    }

    * { box-sizing:border-box; }

    html,body { margin:0; min-height:100%; }

    body {
      background:var(--paper);
      color:var(--ink);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    main {
      min-height:100svh;
      width:min(100%,680px);
      margin:0 auto;
      padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
    }

    .wordmark {
      display:inline-block;
      align-self:flex-start;
      font-size:28px;
      line-height:1;
      font-weight:760;
      letter-spacing:-1.6px;
      text-decoration:none;
      color:var(--ink);
    }

    .hero {
      margin-top:clamp(82px,17vh,145px);
    }

    h1 {
      margin:0;
      max-width:560px;
      font-size:clamp(54px,14vw,88px);
      line-height:.89;
      letter-spacing:-.065em;
      font-weight:630;
    }

    .role {
      margin:22px 0 0;
      color:var(--soft);
      font-size:clamp(17px,4.4vw,21px);
      line-height:1.35;
      letter-spacing:-.02em;
    }

    .contact {
      margin-top:54px;
      border-top:1px solid var(--line);
    }

    .contact a {
      min-height:66px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      border-bottom:1px solid var(--line);
      color:var(--ink);
      text-decoration:none;
      font-size:16px;
      letter-spacing:-.015em;
    }

    .contact .label {
      color:var(--soft);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.055em;
    }

    .contact .value { text-align:right; }

    .action {
      margin-top:auto;
      padding-top:58px;
    }

    .button {
      width:100%;
      min-height:62px;
      border-radius:999px;
      background:var(--ink);
      color:var(--white);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:16px 24px;
      text-decoration:none;
      font-size:17px;
      font-weight:620;
      letter-spacing:-.02em;
      transition:transform .12s ease,opacity .12s ease;
    }

    .button:active { transform:scale(.985); opacity:.88; }

    .support {
      margin:14px auto 0;
      max-width:340px;
      text-align:center;
      color:var(--soft);
      font-size:14px;
      line-height:1.45;
    }

    @media (min-width:640px) {
      main { padding-left:36px; padding-right:36px; }
      .hero { margin-top:130px; }
    }

    @media (max-width:430px) {
      .contact a {
        align-items:flex-start;
        flex-direction:column;
        justify-content:center;
        gap:5px;
        padding:15px 0;
      }
      .contact .value { text-align:left; }
    }
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="https://www.instead.com/" aria-label="Instead">instead</a>

    <section class="hero">
      <h1>Weston<br>Deering</h1>
      <p class="role">Account Executive / Orchestrator</p>

      <div class="contact" aria-label="Contact information">
        <a href="mailto:Weston@instead.com">
          <span class="label">Email</span>
          <span class="value">Weston@instead.com</span>
        </a>
        <a href="tel:+17864813674">
          <span class="label">Phone</span>
          <span class="value">786-481-3674</span>
        </a>
      </div>
    </section>

    <section class="action">
      <a class="button" href="https://corvee.chilipiper.com/me/weston-deering/instead-agents" rel="noopener">Book a quick conversation</a>
      <p class="support">Explore how Instead could fit your firm.</p>
    </section>
  </main>
</body>
</html>
